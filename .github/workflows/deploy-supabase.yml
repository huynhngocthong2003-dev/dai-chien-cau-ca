# Tự động cập nhật database (migrations) và hàm máy chủ (Edge Functions) lên Supabase.
# Cần 2 khóa bí mật (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN – Access token tài khoản Supabase (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD  – Mật khẩu database đã đặt khi tạo dự án
# và biến SUPABASE_URL (đã có) để suy ra mã dự án.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/**", "packages/**", ".github/workflows/deploy-supabase.yml"]
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Kiem tra khoa bi mat
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Chua co SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_URL – bo qua trien khai."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            ref="$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: 2.122.1
      - name: Lien ket du an
        if: steps.chk.outputs.ok == 'true'
        run: supabase link --project-ref "${{ steps.chk.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Cap nhat database (migrations)
        if: steps.chk.outputs.ok == 'true'
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Trien khai ham may chu death-match
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy death-match --project-ref "${{ steps.chk.outputs.ref }}"
