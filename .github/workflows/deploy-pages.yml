# Tự động kiểm thử + build + đăng game lên GitHub Pages mỗi khi đẩy code lên nhánh main.
# Lần đầu: vào Settings → Pages → Source: chọn "GitHub Actions".
name: Deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          # Tài khoản online: đặt trong Settings → Secrets and variables → Actions → Variables.
          # Khóa "anon" của Supabase là khóa công khai (an toàn nhờ RLS). KHÔNG dùng service_role key.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Kiểm tra tài khoản online đã được nạp vào bản build (không in giá trị khóa)
      - name: "Tai khoan online: da cau hinh SUPABASE_URL"
        if: ${{ vars.SUPABASE_URL != '' }}
        run: echo "SUPABASE_URL da duoc dat"
      - name: "Tai khoan online: da cau hinh SUPABASE_ANON_KEY"
        if: ${{ vars.SUPABASE_ANON_KEY != '' }}
        run: echo "SUPABASE_ANON_KEY da duoc dat"
      - name: "Tai khoan online: URL co trong ban build"
        if: ${{ vars.SUPABASE_URL != '' }}
        run: |
          host="$(echo '${{ vars.SUPABASE_URL }}' | sed -E 's#https?://##; s#/.*##')"
          case "$host" in *.supabase.co) ;; *) echo "SUPABASE_URL khong dung dang https://xxxx.supabase.co"; exit 1;; esac
          grep -rqF "$host" apps/game-client/dist/assets || { echo "Khong tim thay URL trong ban build"; exit 1; }
          echo "OK: ban build co dia chi may chu tai khoan"
      # Đấu Trường Quả Cầu Anime (/dau-truong/): chơi trực tuyến & kết bạn qua Supabase Realtime (khóa anon công khai)
      - name: "Dau Truong: nap ket noi online"
        run: node scripts/build-dau-truong.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
