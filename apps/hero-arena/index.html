<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hero Arena</title>
<meta name="theme-color" content="#0d1320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root { --bg: #0d1320; --fg: #f3ead8; --accent: #ffb347; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { font-family: "Baloo 2", system-ui, sans-serif; }
  #game { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: flex; align-items: center; justify-content: center; }
  #game canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; pointer-events: none; }
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--bg); font-size: 20px; font-weight: 700; }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
  .ha-input { position: fixed; z-index: 5; font: 700 20px "Baloo 2", system-ui, sans-serif; padding: 6px 12px; border-radius: 10px; border: 2px solid #ffb347; background: #1a2333; color: #f3ead8; outline: none; text-transform: uppercase; -webkit-user-select: text; user-select: text; touch-action: auto; }
  .ha-input:focus { box-shadow: 0 0 0 4px #ffb34766; }
</style>
</head>
<body>
<div id="loading">Đang tải Hero Arena…</div>
<div id="rotate">Xoay ngang điện thoại để chơi</div>
<div id="game"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
