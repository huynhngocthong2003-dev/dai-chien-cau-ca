    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/><stop offset="0.5" stop-color="#f8fafc"/><stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="34%" r="70%">
