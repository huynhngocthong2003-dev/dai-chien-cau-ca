<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Đại Chiến Câu Cá</title>
<meta name="theme-color" content="#0b2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Câu Cá">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root { --bg: #0b2a4a; --fg: #fff8e1; --accent: #ffc107; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { background: radial-gradient(ellipse at 50% 30%, #1d5b8f 0%, var(--bg) 70%); font-family: "Baloo 2", system-ui, sans-serif; }
  /* Khung game nằm trong vùng an toàn (tránh tai thỏ / camera / thanh điều hướng) */
  /* Khung game phủ toàn màn hình; trên/dưới chừa vùng an toàn, trái/phải game tự chừa (xem ui/wide.ts) */
  #game {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    left: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #game canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; letter-spacing: .02em; pointer-events: none; }
  #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--bg); font-size: 20px; font-weight: 700; }
  #rotate .phone { width: 48px; height: 80px; border: 4px solid var(--accent); border-radius: 10px; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 0%,30% { transform: rotate(0) } 60%,100% { transform: rotate(-90deg) } }
  @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; } }
  /* Ô nhập phủ trên game: luôn cho chọn và gõ chữ (iOS chặn gõ nếu kế thừa user-select:none) */
  .dccc-overlay, .dccc-overlay * { -webkit-user-select: text; user-select: text; touch-action: auto; pointer-events: auto; -webkit-touch-callout: default; }
  .dccc-overlay input, .dccc-overlay textarea { font-size: max(16px, 1em); outline: none; }
  .dccc-overlay input:focus, .dccc-overlay textarea:focus { box-shadow: 0 0 0 4px #ffc10788; }
</style>
</head>
<body>
<div id="loading">Đang tải Đại Chiến Câu Cá…</div>
<div id="rotate"><div class="phone"></div><div>Xoay ngang điện thoại để chơi</div><small style="font-weight:500;opacity:.8">Game hiển thị tốt nhất ở chế độ màn hình ngang</small></div>
<div id="game"></div>
<div id="safe-probe" style="position:fixed;visibility:hidden;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
